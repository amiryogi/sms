<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vidyalaya SMS: attendance, exams, NEB report cards, fees and parent access for Nepali schools from KG to Grade 10." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Vidyalaya SMS — School Management System for Nepal</title>

    <!-- Link previews (Facebook, WhatsApp, Viber, X). Crawlers do not run JavaScript, so these
         must be static and absolute. If the site's address changes, update the URLs here.
         The image is made by `cd e2e && npm run screenshots` (test "og-image"). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vidyalaya SMS" />
    <meta property="og:url" content="https://vidyalaya-sms.vercel.app/" />
    <meta property="og:title" content="Vidyalaya SMS — Run your whole school from one place" />
    <meta property="og:description" content="Attendance, exams, NEB report cards, fees and a parent app for Nepali schools from KG to Grade 10. Built around the Bikram Sambat calendar." />
    <meta property="og:image" content="https://vidyalaya-sms.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vidyalaya SMS: the admin dashboard and the student app on a phone" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vidyalaya SMS — Run your whole school from one place" />
    <meta name="twitter:description" content="Attendance, exams, NEB report cards, fees and a parent app for Nepali schools, KG to Grade 10." />
    <meta name="twitter:image" content="https://vidyalaya-sms.vercel.app/og-image.jpg" />
    <!-- IBM Plex Sans carries the UI; IBM Plex Sans Devanagari carries the Nepali
         text and १२३ numerals the app really renders (Inter has no Devanagari, so
         those strings used to fall back to an unmatched system font). Mono is for
         identifiers only. Weights 400/500/600 are the whole set the app uses —
         see frontend/DESIGN.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter is still loaded on purpose: the printed report card and the fee
         slips are pinned to it in app.css so their page counts and the two
         Playwright pixel baselines do not move. It is not used by the app UI. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
